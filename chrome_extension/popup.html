<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        h1 {
            font-size: 18px;
            margin: 0 0 15px 0;
            color: #333;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .info {
            font-size: 12px;
            color: #666;
            margin-top: 15px;
            line-height: 1.5;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>📥 ComfyWorkflows Downloader</h1>
    <button id="downloadBtn">Download Current Workflow</button>
    <div id="status"></div>
    <div class="info">
        <strong>How to use:</strong><br>
        1. Navigate to a workflow page on ComfyWorkflows.com<br>
        2. Click the download button on the page, or<br>
        3. Use this popup to download the current workflow
    </div>

    <script src="popup.js"></script>
</body>
</html>
